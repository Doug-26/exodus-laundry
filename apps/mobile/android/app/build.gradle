apply plugin: 'com.android.application'

// Read GOOGLE_MAPS_API_KEY from the repo-root .env (git-ignored) so the Maps SDK
// key is injected into the AndroidManifest at build time and never committed.
// Same source of truth as scripts/generate-env.mjs.
def mapsApiKey = ''
def repoEnvFile = rootProject.file('../../../.env')
if (repoEnvFile.exists()) {
    repoEnvFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line.startsWith('GOOGLE_MAPS_API_KEY=')) {
            mapsApiKey = line.substring('GOOGLE_MAPS_API_KEY='.length()).replaceAll(/^["']|["']$/, '')
        }
    }
}

// Release signing (Phase: CI/CD app distribution). Keystore + passwords come from
// environment variables so the key material is never committed — CI injects them
// from GitHub secrets, and local debug builds (which don't set them) are unaffected.
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseSigning = releaseStoreFile != null && !releaseStoreFile.isEmpty() && file(releaseStoreFile).exists()

// versionCode/name are overridable so each CI run publishes a distinct release
// (Firebase App Distribution dedupes by version).
def envVersionCode = System.getenv('ANDROID_VERSION_CODE')
def envVersionName = System.getenv('ANDROID_VERSION_NAME')

android {
    namespace = "com.exodus.laundry"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.exodus.laundry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode envVersionCode ? envVersionCode.toInteger() : 1
        versionName envVersionName ?: "1.0"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the release key when it's available (CI); otherwise Gradle
            // leaves it unsigned so local `assembleRelease` still runs.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
